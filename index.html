    // --- HELPER: Fresnel Glow Shader (Inline) ---
    function getFresnelMat({rimHex = 0x0088ff, facingHex = 0x000000} = {}) {
      const uniforms = {
        color1: { value: new THREE.Color(rimHex) },
        color2: { value: new THREE.Color(facingHex) },
        fresnelBias: { value: 0.1 },
        fresnelScale: { value: 1.0 },
        fresnelPower: { value: 4.0 },
      };
      const vs = `
      uniform float fresnelBias;
      uniform float fresnelScale;
      uniform float fresnelPower;
      varying float vReflectionFactor;
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
        vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
        vec3 worldNormal = normalize( mat3( modelMatrix[0].xyz, modelMatrix[1].xyz, modelMatrix[2].xyz ) * normal );
        vec3 I = worldPosition.xyz - cameraPosition;
        vReflectionFactor = fresnelBias + fresnelScale * pow( 1.0 + dot( normalize( I ), worldNormal ), fresnelPower );
        gl_Position = projectionMatrix * mvPosition;
      }
      `;
      const fs = `
      uniform vec3 color1;
      uniform vec3 color2;
      varying float vReflectionFactor;
      void main() {
        float f = clamp( vReflectionFactor, 0.0, 1.0 );
        gl_FragColor = vec4(mix(color2, color1, vec3(f)), f);
      }
      `;
      const fresnelMat = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: vs,
        fragmentShader: fs,
        transparent: true,
        blending: THREE.AdditiveBlending,
      });
      return fresnelMat;
    }
	
	// --- HELPER: getStarfield (Inline) ---
	function getStarfield({ numStars = 500 } = {}) {
      function randomSpherePoint() {
      // const radius = Math.random() * 25 + 25;
	  const radius = Math.random() * 750 + 750; // CDA spread them out
      const u = Math.random();
      const v = Math.random();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      let x = radius * Math.sin(phi) * Math.cos(theta);
      let y = radius * Math.sin(phi) * Math.sin(theta);
      let z = radius * Math.cos(phi);

      return {
        pos: new THREE.Vector3(x, y, z - 800), // CDA to put stars behind globe 
        hue: 0.6,
        minDist: radius, 
      };
    }
      const verts = [];
      const colors = [];
      const positions = [];
      let col;
      for (let i = 0; i < numStars; i += 1) {
        let p = randomSpherePoint();
        const { pos, hue } = p;
        positions.push(p);
        col = new THREE.Color().setHSL(hue, 0.2, Math.random());
        verts.push(pos.x, pos.y, pos.z);
        colors.push(col.r, col.g, col.b);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        map: new THREE.TextureLoader().load("./threejs-earth/textures/stars/circle.png"),
      });
      const points = new THREE.Points(geo, mat);
      return points;
    }

        uniform float uTime;
        varying vec3 vWorldPosition;

        // smin (Polynomial smooth minimum) - Creates the gooey tension
        float smin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
        }
        // Scene mapping
        vec2 map(vec3 p) {            
		// Ceiling is y=10. Sphere diameter is 3.0 (radius 1.5).
            // Half diameter below ceiling = 1.5 gap. 
            // So top of sphere is 8.5. Center is at 7.0.
            float d1 = length(p - vec3(0.0, 7.0, 0.0)) - 1.5;

            // Falling sphere loops from y=7.0 down to y=0.0
            float fallSpeed = 2.0;
            float fallY = 7.0 - mod(uTime * fallSpeed, 7.0);
            float d2 = length(p - vec3(0.0, fallY, 0.0)) - 0.7;  // Smaller drop

            // Blend them together
            float d = smin(d1, d2, 1.8); // 1.8 is the "goo" factor

            return vec2(d, fallY);
        }

        // Calculate normals for lighting
        vec3 calcNormal(vec3 p) {
            const vec2 e = vec2(0.01, 0.0);
            return normalize(vec3(
                map(p + e.xyy).x - map(p - e.xyy).x,
                map(p + e.yxy).x - map(p - e.yxy).x,
                map(p + e.yyx).x - map(p - e.yyx).x
            ));
        }

        void main() {
            vec3 ro = cameraPosition;
            vec3 rd = normalize(vWorldPosition - cameraPosition);

            float t = 0.0;
            float maxD = 40.0;
            float hitFallY = 0.0;

            // Raymarching loop
            for(int i = 0; i < 64; i++) {
                vec3 p = ro + rd * t;
                vec2 res = map(p);
                float d = res.x;
                hitFallY = res.y;
                
                if(abs(d) < 0.001 || t > maxD) break;
                t += d;
            }

            if(t < maxD) {
                // We hit the sphere!
                vec3 p = ro + rd * t;
                vec3 n = calcNormal(p);

                // Basic directional lighting
                vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                float diff = max(dot(n, lightDir), 0.0);
                float ambient = 0.2;

                vec3 finalColor;

                gl_FragColor = vec4(glow, 1.0);

                // We hit nothing, discard pixel so background shows
                discard;

        }

        let b = heat < 0.5 ? 1.0 - (heat * 2.0) : 0.0;
        
        // dripLight.color.setRGB(r, Math.max(0, g), Math.max(0, b));
        // If it's high up, keep the physical light pure white
        if (heat <= 0.0) {
            dripLight.color.setRGB(1.0, 1.0, 1.0);
        } else {
            dripLight.color.setRGB(r, Math.max(0, g), Math.max(0, b));
        }
		/* Camera Presets v3.46 Part 4 */
		time *= 0.001; // convert to seconds        
        // --- UPDATE LIVE CAMERA UI ---
        // Round to 1 decimal place for clean UI display
        guiObj.camX = parseFloat(camera.position.x.toFixed(1));
        guiObj.camY = parseFloat(camera.position.y.toFixed(1));
        guiObj.camZ = parseFloat(camera.position.z.toFixed(1));
        // Show where the camera is looking:
        guiObj.tarX = parseFloat(controls.target.x.toFixed(1));
		guiObj.tarY = parseFloat(controls.target.y.toFixed(1));
		guiObj.tarZ = parseFloat(controls.target.z.toFixed(1));
		
        renderer.render(scene, camera);
    }
    animate();
	
	function handleWindowResize () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', handleWindowResize, false);
</script>
